[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeconf"
version = "0.1.0"
description = "Conformance and fault-injection harness for services that turn bank and stablecoin callbacks into ledger entries: duplicates, replays, lost responses, crashes mid-write and out-of-order callbacks, with invariant checks and shrunk counterexamples. Engineering checklist, not legal advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["webhooks", "payments", "idempotency", "fault-injection", "property-based-testing", "stablecoin", "ach", "fednow"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/bridge-conformance"

[project.scripts]
bridgeconf = "bridgeconf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bridgeconf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
